---
name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "ansible_collections/eneskose/teleport/**"
  pull_request:
    paths:
      - "ansible_collections/eneskose/teleport/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: ansible_collections/eneskose/teleport

jobs:
  lint:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install "ansible-core>=2.16" ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check playbooks
        run: |
          ansible-galaxy collection install . -p /tmp/collections
          ANSIBLE_COLLECTIONS_PATH=/tmp/collections \
            ansible-playbook --syntax-check \
            -i playbooks/inventory/hosts.yml playbooks/site.yml

      - name: Build collection
        run: ansible-galaxy collection build --output-path /tmp/build
