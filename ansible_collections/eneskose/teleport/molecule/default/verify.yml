---
- name: Verify
  hosts: teleport_auth
  become: true
  tasks:
    - name: Teleport binary is installed
      ansible.builtin.command: teleport version
      register: _tv
      changed_when: false

    - name: Config file exists
      ansible.builtin.stat:
        path: /etc/teleport.yaml
      register: _cfg

    - name: Assert config rendered and service present
      ansible.builtin.assert:
        that:
          - _tv.rc == 0
          - _cfg.stat.exists
        quiet: true
