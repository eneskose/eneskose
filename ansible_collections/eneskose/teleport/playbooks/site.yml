---
# Full cluster deployment: Auth Service first, then Proxy Service.
# Usage:
#   ansible-playbook -i playbooks/inventory/hosts.yml playbooks/site.yml \
#     --ask-vault-pass

- name: Deploy Teleport Auth Service
  hosts: teleport_auth
  become: true
  gather_facts: true
  roles:
    - role: eneskose.teleport.teleport_auth

- name: Deploy Teleport Proxy Service
  hosts: teleport_proxy
  become: true
  gather_facts: true
  roles:
    - role: eneskose.teleport.teleport_proxy
