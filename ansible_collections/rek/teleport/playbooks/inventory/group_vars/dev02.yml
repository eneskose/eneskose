---
# Environment-specific variables for the 'dev02' environment.
teleport_auth_cluster_name: "teleport.dev02.example.com"
teleport_auth_webauthn_rp_id: "teleport.dev02.example.com"

# Proxy -> Auth over the private network (host:3025).
teleport_auth_server: "10.30.2.10:3025"

# CA pin is auto-discovered from the Auth host at run time (teleport_proxy_autojoin).
# Set teleport_ca_pin explicitly here only to pin it out-of-band.

# Public entrypoint.
teleport_proxy_public_addr: "teleport.dev02.example.com:443"

# --- Bastion / jump host ----------------------------------------------------
# These hosts are not reachable directly; SSH is proxied through a jump host.
# ProxyJump tunnels the connection end-to-end — your key/agent authenticates
# from the controller and is never copied onto the bastion. CheckHostIP=no
# avoids known_hosts collisions when environments reuse the same target IPs.
# Set teleport_use_bastion=false (e.g. in AAP/Controller, which has direct
# routing) to connect without the jump host. See docs/bastion.md.
teleport_bastion: "bastion@jump.dev02.example.com"
teleport_use_bastion: true
ansible_ssh_common_args: >-
  {{ ('-o ProxyJump=' ~ teleport_bastion ~ ' -o CheckHostIP=no -o StrictHostKeyChecking=accept-new')
     if (teleport_use_bastion | bool) else '' }}
