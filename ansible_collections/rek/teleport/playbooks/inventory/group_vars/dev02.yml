---
# Environment-specific variables for the 'dev02' environment.
teleport_auth_cluster_name: "teleport.dev02.example.com"
teleport_auth_webauthn_rp_id: "teleport.dev02.example.com"

# Proxy -> Auth over the private network (host:3025).
teleport_auth_server: "10.30.2.10:3025"

# CA pin from `tctl status` on the Auth host (strongly recommended).
teleport_ca_pin:
  - "sha256:REPLACE_WITH_REAL_PIN"

# Public entrypoint + ACME contact.
teleport_proxy_public_addr: "teleport.dev02.example.com:443"
teleport_proxy_acme_email: "dev@example.com"
