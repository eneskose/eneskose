---
# Environment-specific variables for the 'hw01' environment.
teleport_auth_cluster_name: "teleport.hw01.example.com"
teleport_auth_webauthn_rp_id: "teleport.hw01.example.com"

# Proxy -> Auth over the private network (host:3025).
teleport_auth_server: "10.20.1.10:3025"

# CA pin from `tctl status` on the Auth host (strongly recommended).
teleport_ca_pin:
  - "sha256:REPLACE_WITH_REAL_PIN"

# Public entrypoint + ACME contact.
teleport_proxy_public_addr: "teleport.hw01.example.com:443"
teleport_proxy_acme_email: "ops@example.com"

# --- Bastion / jump host ----------------------------------------------------
# These hosts are not reachable directly; SSH is proxied through a jump host.
# ProxyJump tunnels the connection end-to-end — your key/agent authenticates
# from the controller and is never copied onto the bastion. See docs/bastion.md.
teleport_bastion: "bastion@jump.hw01.example.com"
ansible_ssh_common_args: >-
  -o ProxyJump={{ teleport_bastion }}
  -o StrictHostKeyChecking=accept-new
