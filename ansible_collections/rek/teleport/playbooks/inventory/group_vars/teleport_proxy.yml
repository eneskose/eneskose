---
# Proxy Service group variables — environment-independent defaults.
# Environment-specific values (auth server, CA pin, public address, ACME email)
# live in the per-environment group_vars: example.yml / hw01.yml / dev02.yml.

# Join token (vault-encrypt).
teleport_join_token: "{{ vault_teleport_join_token }}"

# TLS via ACME/Let's Encrypt (set false to use teleport_proxy_https_keypairs).
teleport_proxy_web_listen_addr: "0.0.0.0:443"
teleport_proxy_acme_enabled: true
