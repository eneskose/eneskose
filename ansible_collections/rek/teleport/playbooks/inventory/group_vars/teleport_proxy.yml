---
# Proxy Service group variables — environment-independent defaults.
# Environment-specific values (auth server, public address) live in the
# per-environment group_vars: example.yml / hw01.yml / dev02.yml.

# Join token + CA pin are auto-bootstrapped from the Auth host at run time
# (teleport_proxy_autojoin, default true) — nothing to set here. Provide
# teleport_join_token / teleport_ca_pin explicitly only to opt out.

teleport_proxy_web_listen_addr: "0.0.0.0:443"

# TLS provider is chosen per environment (group_vars/<env>.yml), because the
# OpenBao endpoint/role differ per environment. The role default is 'keypairs'
# (supply certs via teleport_proxy_https_keypairs); hw01/dev02 set 'openbao'.
# Do not pin it here: teleport_proxy is a child of each env group, so a value
# set here would override the env's choice.
