---
# Sample inventory — the "example" environment, with dedicated Auth and Proxy
# instances. Environment-specific variables live in group_vars/example.yml.
# See hw01.yml and dev02.yml for additional environments; target one with
# `-i playbooks/inventory/<env>.yml`.
all:
  children:
    example:
      children:
        teleport_auth:
          hosts:
            auth1.example.com:
              ansible_host: 10.0.1.10
        teleport_proxy:
          hosts:
            proxy1.example.com:
              ansible_host: 203.0.113.20
