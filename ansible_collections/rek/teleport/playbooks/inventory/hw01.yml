---
# Environment: hw01. Dedicated Auth and Proxy instances.
# Environment-specific variables live in group_vars/hw01.yml.
# Usage: ansible-playbook -i playbooks/inventory/hw01.yml playbooks/site.yml
all:
  children:
    hw01:
      children:
        teleport_auth:
          hosts:
            auth1.hw01.example.com:
              ansible_host: 10.20.1.10
        teleport_proxy:
          hosts:
            proxy1.hw01.example.com:
              ansible_host: 10.20.1.20
