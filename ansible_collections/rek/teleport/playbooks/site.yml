---
# Full cluster deployment: Auth Service first, then Proxy Service, then the
# Windows Desktop Service (skipped automatically when the inventory has no
# teleport_desktop group).
# Usage:
#   ansible-playbook -i playbooks/inventory/hosts.yml playbooks/site.yml \
#     --ask-vault-pass

- name: Deploy Teleport Auth Service
  hosts: teleport_auth
  become: true
  gather_facts: true
  roles:
    - role: rek.teleport.teleport_auth

- name: Deploy Teleport Proxy Service
  hosts: teleport_proxy
  become: true
  gather_facts: true
  roles:
    - role: rek.teleport.teleport_proxy

- name: Deploy Teleport Windows Desktop Service
  hosts: teleport_desktop
  become: true
  gather_facts: true
  roles:
    - role: rek.teleport.teleport_desktop
