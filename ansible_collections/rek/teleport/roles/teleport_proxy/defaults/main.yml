---
# ===========================================================================
# teleport_proxy — Proxy Service configuration.
# Inherits base/global variables from teleport_install.
# The Proxy is the ONLY component that should be reachable from the internet.
# ===========================================================================

# --- Cluster join (how the Proxy connects to the Auth Service) --------------
# Address of the Auth Service API (host:3025), reachable on the private network.
# In an HA setup this is typically a load balancer in front of the Auth nodes.
teleport_auth_server: "auth.example.com:3025"

# CA pin(s) the Proxy verifies when joining (prevents MITM on join). Leave
# empty to have it auto-discovered from the Auth host (see autojoin below);
# set explicitly to pin out-of-band.
teleport_ca_pin: []

# Join token. Leave empty to have a short-lived token minted on the Auth host
# at run time (autojoin); set explicitly (vault-encrypt!) to use a static token.
teleport_join_token: ""
teleport_join_method: token        # token | iam | ec2 | kubernetes | ...

# --- Auto-bootstrap join (no manual tctl copy/paste) ------------------------
# When true and teleport_ca_pin / teleport_join_token are empty, the Proxy run
# delegates to an Auth host to read the CA pin (`tctl status`) and mint a
# short-lived join token (`tctl tokens add`). Requires an Auth host in the
# inventory, reachable at run time, with the Auth Service already up.
teleport_proxy_autojoin: true
teleport_join_token_ttl: "1h"
# Auth host the tctl calls are delegated to (defaults to the first Auth node).
teleport_autojoin_auth_host: "{{ groups['teleport_auth'][0] | default('') }}"
# tctl binary on the Auth host (derived from the teleport binary path).
teleport_tctl_bin: "{{ teleport_bin | dirname }}/tctl"

# --- Public addressing ------------------------------------------------------
# Public address users/clients reach (host:port). With TLS routing this is the
# single 443 entrypoint for web UI, SSH, Kube, DB, etc.
teleport_proxy_public_addr: "teleport.example.com:443"
teleport_proxy_web_listen_addr: "0.0.0.0:443"

# --- TLS for the web/proxy listener -----------------------------------------
# How the Proxy obtains its serving certificate:
#   keypairs -> use teleport_proxy_https_keypairs (provide cert/key yourself)
#   openbao  -> issue from OpenBao PKI at run time (see below)
teleport_proxy_tls_provider: keypairs

# Bring your own certificate(s). Each item: {key_file, cert_file}. With the
# 'openbao' provider this is populated automatically from the issued cert.
teleport_proxy_https_keypairs: []

# --- OpenBao / Vault PKI (teleport_proxy_tls_provider: openbao) --------------
# The Proxy host fetches a cert from OpenBao's PKI engine at run time. The
# private key is generated by OpenBao and written only on the Proxy. Requires
# the `hvac` Python library on the Proxy (installed by the role) and network
# access to OpenBao. Re-issues only when the cert is missing or near expiry.
teleport_proxy_openbao_url: ""                 # e.g. https://openbao.example.com:8200
teleport_proxy_openbao_token: ""               # token auth (vault-encrypt; or VAULT_TOKEN env)
teleport_proxy_openbao_ca_cert: ""             # CA file to verify OpenBao's API TLS
teleport_proxy_openbao_namespace: ""           # usually empty for OpenBao
teleport_proxy_openbao_pki_mount: pki
teleport_proxy_openbao_pki_role: teleport-proxy
teleport_proxy_openbao_cert_ttl: "2160h"
teleport_proxy_openbao_cert_common_name: "{{ teleport_proxy_public_addr | split(':') | first }}"
teleport_proxy_openbao_cert_alt_names: []
teleport_proxy_openbao_cert_ip_sans: []
teleport_proxy_openbao_renew_threshold_days: 30

# Where the issued cert/key are written (openbao provider).
teleport_proxy_tls_dir: "{{ teleport_data_dir }}/tls"
teleport_proxy_tls_cert_file: "{{ teleport_proxy_tls_dir }}/proxy.crt"
teleport_proxy_tls_key_file: "{{ teleport_proxy_tls_dir }}/proxy.key"

# Free-form mapping merged into proxy_service for advanced options
# (e.g. kube_listen_addr, postgres_public_addr, mysql_public_addr).
teleport_proxy_extra_config: {}
