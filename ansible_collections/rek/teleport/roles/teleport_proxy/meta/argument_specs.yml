---
argument_specs:
  main:
    short_description: Configure and run the Teleport Proxy Service.
    options:
      teleport_auth_server:
        type: str
        required: true
        description: Auth Service API address (host:3025) on the private network.
      teleport_ca_pin:
        type: list
        elements: str
        default: []
        description: >-
          CA pin(s) verified on join. Empty -> auto-discovered from the Auth
          host when teleport_proxy_autojoin is true.
      teleport_join_token:
        type: str
        default: ""
        description: >-
          Provisioning token used to join. Empty -> a short-lived token is
          minted on the Auth host when teleport_proxy_autojoin is true. If set
          explicitly, vault-encrypt it.
      teleport_join_method:
        type: str
        default: token
        choices: [token, iam, ec2, kubernetes, gcp, azure]
        description: Join method.
      teleport_proxy_autojoin:
        type: bool
        default: true
        description: >-
          When CA pin / join token are empty, delegate to an Auth host to
          discover the pin and mint a short-lived token at run time.
      teleport_join_token_ttl:
        type: str
        default: "1h"
        description: TTL for the auto-minted join token.
      teleport_autojoin_auth_host:
        type: str
        default: "{{ groups['teleport_auth'][0] | default('') }}"
        description: Inventory host the tctl auto-join calls are delegated to.
      teleport_tctl_bin:
        type: str
        default: "{{ teleport_bin | dirname }}/tctl"
        description: Path to tctl on the Auth host (for auto-join).
      teleport_proxy_public_addr:
        type: str
        default: "teleport.example.com:443"
        description: Public address users reach the proxy on.
      teleport_proxy_web_listen_addr:
        type: str
        default: "0.0.0.0:443"
        description: Listen address for the web/proxy listener.
      teleport_proxy_tls_provider:
        type: str
        default: keypairs
        choices: [keypairs, openbao]
        description: >-
          How the Proxy gets its serving cert: 'keypairs' (you supply
          teleport_proxy_https_keypairs) or 'openbao' (issued from OpenBao PKI).
      teleport_proxy_https_keypairs:
        type: list
        elements: dict
        default: []
        description: >-
          Explicit TLS key/cert pairs. Auto-populated when tls_provider=openbao.
      teleport_proxy_openbao_url:
        type: str
        default: ""
        description: OpenBao/Vault API address (required for the openbao provider).
      teleport_proxy_openbao_token:
        type: str
        default: ""
        description: Token for OpenBao auth (vault it, or use the VAULT_TOKEN env).
      teleport_proxy_openbao_ca_cert:
        type: str
        default: ""
        description: CA file to verify OpenBao's API TLS.
      teleport_proxy_openbao_namespace:
        type: str
        default: ""
        description: OpenBao/Vault namespace (usually empty for OpenBao).
      teleport_proxy_openbao_pki_mount:
        type: str
        default: pki
        description: Mount point of the OpenBao PKI engine.
      teleport_proxy_openbao_pki_role:
        type: str
        default: teleport-proxy
        description: PKI role used to issue the certificate.
      teleport_proxy_openbao_cert_ttl:
        type: str
        default: "2160h"
        description: Requested certificate TTL.
      teleport_proxy_openbao_cert_common_name:
        type: str
        default: "{{ teleport_proxy_public_addr | split(':') | first }}"
        description: Certificate common name (defaults to the public address host).
      teleport_proxy_openbao_cert_alt_names:
        type: list
        elements: str
        default: []
        description: Additional DNS SANs.
      teleport_proxy_openbao_cert_ip_sans:
        type: list
        elements: str
        default: []
        description: IP SANs.
      teleport_proxy_openbao_renew_threshold_days:
        type: int
        default: 30
        description: Re-issue when the existing cert expires within this many days.
      teleport_proxy_openbao_manage_role:
        type: bool
        default: false
        description: >-
          Create/update the PKI role just before issuing. Needs a token with
          write access to <pki_mount>/roles/<pki_role>.
      teleport_proxy_openbao_pki_allowed_domains:
        type: list
        elements: str
        default: "{{ ([teleport_proxy_openbao_cert_common_name] + teleport_proxy_openbao_cert_alt_names) | select | list }}"
        description: >-
          Domains the managed role may issue for (defaults to the cert common
          name plus its DNS SANs). Required when manage_role is true.
      teleport_proxy_openbao_pki_allow_subdomains:
        type: bool
        default: false
        description: Allow subdomains of allowed_domains in the managed role.
      teleport_proxy_openbao_pki_allow_bare_domains:
        type: bool
        default: true
        description: Allow exact (bare) allowed_domains in the managed role.
      teleport_proxy_openbao_pki_allow_wildcard_certificates:
        type: bool
        default: false
        description: Allow wildcard certificates from the managed role.
      teleport_proxy_openbao_pki_server_flag:
        type: bool
        default: true
        description: Set the server EKU flag on certs from the managed role.
      teleport_proxy_openbao_pki_client_flag:
        type: bool
        default: false
        description: Set the client EKU flag on certs from the managed role.
      teleport_proxy_openbao_pki_max_ttl:
        type: str
        default: "{{ teleport_proxy_openbao_cert_ttl }}"
        description: Upper bound on the managed role's issuable TTL.
      teleport_proxy_tls_dir:
        type: str
        default: "{{ teleport_data_dir }}/tls"
        description: Directory for the openbao-issued cert/key.
      teleport_proxy_tls_cert_file:
        type: str
        default: "{{ teleport_proxy_tls_dir }}/proxy.crt"
        description: Path of the issued certificate (leaf + chain).
      teleport_proxy_tls_key_file:
        type: str
        default: "{{ teleport_proxy_tls_dir }}/proxy.key"
        description: Path of the issued private key.
      teleport_proxy_extra_config:
        type: dict
        default: {}
        description: Extra keys merged into proxy_service.
