---
- name: Validate Proxy Service variables
  ansible.builtin.assert:
    that:
      - teleport_auth_server | length > 0
      - teleport_proxy_public_addr | length > 0
      - teleport_proxy_web_listen_addr | length > 0
      - teleport_proxy_tls_provider in ['keypairs', 'openbao']
    fail_msg: >-
      Proxy requires teleport_auth_server, teleport_proxy_public_addr and
      teleport_proxy_web_listen_addr; teleport_proxy_tls_provider must be
      'keypairs' or 'openbao'.
    quiet: true

- name: Auto-discover CA pin and mint join token from the Auth host
  ansible.builtin.include_tasks: bootstrap_join.yml
  when:
    - teleport_proxy_autojoin | bool
    - (teleport_ca_pin | length == 0) or (teleport_join_token | length == 0)

- name: Warn when joining without a CA pin
  ansible.builtin.debug:
    msg: >-
      WARNING: teleport_ca_pin is empty. Joining without CA pinning is
      vulnerable to man-in-the-middle attacks. Set it, or enable
      teleport_proxy_autojoin to discover it from the Auth host.
  when: teleport_ca_pin | length == 0

- name: Obtain TLS certificate from OpenBao PKI
  ansible.builtin.include_tasks: tls_openbao.yml
  when: teleport_proxy_tls_provider == 'openbao'

- name: Render Proxy Service configuration
  ansible.builtin.template:
    src: teleport-proxy.yaml.j2
    dest: "{{ teleport_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ (teleport_bin ~ ' configure --test %s') if (teleport_validate_config | bool) else omit }}"
  no_log: "{{ teleport_join_token | length > 0 }}"
  notify: Restart Teleport

- name: Ensure Teleport Proxy Service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ teleport_service_name }}"
    enabled: "{{ teleport_service_enabled }}"
    state: "{{ teleport_service_state }}"
    daemon_reload: true
