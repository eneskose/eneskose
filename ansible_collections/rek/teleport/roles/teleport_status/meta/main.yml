---
galaxy_info:
  role_name: teleport_status
  author: Enes Köse
  description: >-
    Read-only verification of Teleport node and cluster health: service state,
    version, readiness endpoint, proxy web API, and tctl cluster status. Reports
    by default; can assert/fail as a CI or post-deploy gate.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
  galaxy_tags:
    - teleport
    - security
    - monitoring
    - healthcheck

# Standalone, read-only role — depends on nothing.
dependencies: []
